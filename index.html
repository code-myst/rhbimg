<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্মার্ট ছবি লিংক ম্যানেজার</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, #f0f2f5 0%, #e6e9f0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .box {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      width: 100%;
      max-width: 480px;
      padding: 24px 20px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 10, 30, 0.12), 0 8px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #1a2639;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      letter-spacing: -0.3px;
    }

    .upload-area {
      background: #f9fafc;
      border-radius: 20px;
      padding: 10px;
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px 10px;
      border: 2px dashed #b9c7da;
      border-radius: 16px;
      background: white;
      font-size: 0.95rem;
      color: #2d3b4f;
      cursor: pointer;
    }

    input[type="file"]:hover { border-color: #4a7dff; background: #f0f7ff; }

    button {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      margin: 6px 0;
    }

    button:active { transform: scale(0.98); }

    #uploadBtn {
      background: #0b2b5c;
      color: white;
      box-shadow: 0 6px 14px rgba(11, 43, 92, 0.25);
    }
    #uploadBtn:hover:not(:disabled) { background: #1e3f7a; }
    #uploadBtn:disabled { background: #a0b3cc; cursor: not-allowed; opacity: 0.7; }

    #status {
      font-size: 0.9rem;
      margin: 12px 0 8px;
      min-height: 24px;
      font-weight: 500;
      color: #1e3f7a;
      background: #eef3fc;
      padding: 10px 14px;
      border-radius: 40px;
      text-align: center;
      word-break: break-word;
    }

    .preview { margin: 12px 0 10px; display: flex; justify-content: center; }
    .preview img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 20px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      border: 2px solid white;
      object-fit: cover;
    }

    .saved-links {
      margin-top: 24px;
      border-top: 2px solid #dfe7f0;
      padding-top: 16px;
    }

    .saved-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .saved-header h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #1a2639;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-all-btn {
      width: auto;
      padding: 8px 14px;
      font-size: 0.8rem;
      background: #e8f0fe;
      color: #1a4b8c;
      border-radius: 30px;
      margin: 0;
      gap: 4px;
      box-shadow: none;
      border: 1px solid #cfe0f7;
      font-weight: 600;
    }
    .copy-all-btn:hover { background: #d6e4fd; }

    #linkList {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 8px 10px;
      border-radius: 60px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      border: 1px solid #e9eef5;
      transition: all 0.15s;
    }
    .link-item:hover { border-color: #cbd9eb; }

    .link-item canvas {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: #f2f6fe;
      flex-shrink: 0;
      border: 1px solid #d9e2ef;
    }

    .link-text {
      flex: 1;
      font-size: 0.75rem;
      color: #1f334d;
      word-break: break-all;
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #f4f8ff;
      padding: 6px 10px;
      border-radius: 30px;
      line-height: 1.4;
      max-height: 60px;
      overflow-y: auto;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      flex-shrink: 0;
      font-size: 1rem;
      transition: all 0.15s;
    }

    .copy-btn {
      background: #e6f4ea;
      color: #157347;
      border: 1px solid #c8e6d0;
    }
    .copy-btn:hover { background: #c8e6d0; }
    .copy-btn.copied {
      background: #157347;
      color: white;
      border-color: #157347;
    }

    .delete-btn {
      background: #ffeef0;
      color: #b02a37;
      font-weight: 700;
      border: 1px solid #ffd9de;
    }
    .delete-btn:hover { background: #ffd9de; color: #8b1a2b; }

    .empty-message {
      text-align: center;
      color: #8394a8;
      font-size: 0.9rem;
      padding: 24px 12px;
      background: #f8fafd;
      border-radius: 24px;
      border: 1px dashed #cbd7e8;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1a2639;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      z-index: 9999;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { background: #b02a37; }

    #linkList::-webkit-scrollbar { width: 5px; }
    #linkList::-webkit-scrollbar-track { background: #eef2f8; border-radius: 10px; }
    #linkList::-webkit-scrollbar-thumb { background: #b6c8df; border-radius: 10px; }
    .link-text::-webkit-scrollbar { width: 3px; }
    .link-text::-webkit-scrollbar-thumb { background: #c0d0e4; border-radius: 10px; }
  </style>
</head>
<body>
<div class="box">
  <h2><span>📸</span> স্মার্ট লিংক সেভ</h2>

  <div class="upload-area">
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <button id="uploadBtn" onclick="upload()">
    <span>☁️</span> আপলোড করে লিংক সেভ করো
  </button>

  <p id="status">✨ ছবি সিলেক্ট করো, তারপর আপলোড</p>

  <div class="preview" id="preview"></div>

  <div class="saved-links">
    <div class="saved-header">
      <h3><span>🔗</span> সেভ করা লিংক</h3>
      <button class="copy-all-btn" id="copyAllBtn" onclick="copyAllLinks()" style="display:none;">
        📋 সব কপি
      </button>
    </div>
    <div id="linkList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function () {
    // ---------- Cloudinary কনফিগ ----------
    const cloudName = "wswiilug";
    const uploadPreset = "atifaj";

    // ⚠️ পুরনো লিংক ফিরে পেতে চাইলে এখানে পুরনো key ব্যবহার করুন:
    // const storageKey = "saved_image_links";
    const storageKey = "saved_image_links_smart";

    // পুরনো key → নতুন key মাইগ্রেশন (একবারই হবে)
    const oldKey = "saved_image_links";
    if (localStorage.getItem(oldKey) && !localStorage.getItem(storageKey)) {
      localStorage.setItem(storageKey, localStorage.getItem(oldKey));
      console.log("✅ পুরনো লিংক মাইগ্রেট হয়েছে");
    }

    // DOM
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusEl = document.getElementById('status');
    const previewDiv = document.getElementById('preview');
    const linkListDiv = document.getElementById('linkList');
    const copyAllBtn = document.getElementById('copyAllBtn');
    const toastEl = document.getElementById('toast');

    // ---------- Toast helper ----------
    let toastTimer = null;
    function showToast(msg, isError = false) {
      toastEl.textContent = msg;
      toastEl.classList.toggle('error', isError);
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // ---------- Clipboard helper (fallback সহ) ----------
    async function copyToClipboard(text) {
      // আধুনিক API
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {
          console.warn('clipboard API failed, fallback...', err);
        }
      }
      // পুরনো পদ্ধতি (fallback)
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        ta.setAttribute('readonly', '');
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (err) {
        return false;
      }
    }

    // ---------- প্রিভিউ ----------
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          previewDiv.innerHTML = '';
          const img = document.createElement('img');
          img.src = ev.target.result;
          img.alt = 'প্রিভিউ';
          previewDiv.appendChild(img);
        };
        reader.readAsDataURL(file);
        statusEl.innerText = `📁 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      } else {
        previewDiv.innerHTML = '';
        statusEl.innerText = '✨ ছবি সিলেক্ট করো, তারপর আপলোড';
      }
    });

    // ---------- থাম্বনেইল ----------
    function createThumb(url, callback) {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const size = 50;
          canvas.width = size;
          canvas.height = size;
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
          callback(canvas);
        } catch (e) { callback(null); }
      };
      img.onerror = () => callback(null);
      img.src = url;
    }

    // ---------- লিংক রেন্ডার ----------
    function renderSavedLinks() {
      const links = JSON.parse(localStorage.getItem(storageKey) || "[]");
      linkListDiv.innerHTML = '';

      // "সব কপি" বাটন দেখাও/লুকাও
      copyAllBtn.style.display = links.length > 0 ? 'flex' : 'none';

      if (links.length === 0) {
        linkListDiv.innerHTML = `<div class="empty-message">📭 কোনো লিংক সেভ করা নেই</div>`;
        return;
      }

      links.forEach((link, index) => {
        const item = document.createElement('div');
        item.className = 'link-item';

        const canvasPlaceholder = document.createElement('canvas');
        canvasPlaceholder.width = 50;
        canvasPlaceholder.height = 50;
        canvasPlaceholder.style.background = '#eef3fc';

        const linkSpan = document.createElement('span');
        linkSpan.className = 'link-text';
        linkSpan.textContent = link;

        // 📋 কপি বাটন
        const copyBtn = document.createElement('button');
        copyBtn.className = 'icon-btn copy-btn';
        copyBtn.innerHTML = '📋';
        copyBtn.title = 'লিংক কপি করো';
        copyBtn.setAttribute('aria-label', 'লিংক কপি');
        copyBtn.onclick = async (e) => {
          e.stopPropagation();
          const ok = await copyToClipboard(link);
          if (ok) {
            copyBtn.innerHTML = '✅';
            copyBtn.classList.add('copied');
            showToast('✅ লিংক কপি হয়েছে!');
            setTimeout(() => {
              copyBtn.innerHTML = '📋';
              copyBtn.classList.remove('copied');
            }, 1500);
          } else {
            showToast('❌ কপি করা যায়নি', true);
          }
        };

        // ✕ ডিলিট বাটন
        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn delete-btn';
        delBtn.innerHTML = '✕';
        delBtn.title = 'ডিলিট করো';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteLink(index);
        };

        item.appendChild(canvasPlaceholder);
        item.appendChild(linkSpan);
        item.appendChild(copyBtn);
        item.appendChild(delBtn);
        linkListDiv.appendChild(item);

        // থাম্বনেইল
        createThumb(link, (canvas) => {
          if (canvas && item.firstChild && item.firstChild.tagName === 'CANVAS') {
            item.replaceChild(canvas, item.firstChild);
          } else if (item.firstChild && item.firstChild.tagName === 'CANVAS') {
            const fb = document.createElement('div');
            fb.style.cssText = 'width:46px;height:46px;border-radius:12px;background:#d9e2ef;display:flex;align-items:center;justify-content:center;font-size:22px;';
            fb.innerText = '🖼️';
            item.replaceChild(fb, item.firstChild);
          }
        });
      });
    }

    // ---------- সব কপি ----------
    window.copyAllLinks = async function () {
      const links = JSON.parse(localStorage.getItem(storageKey) || "[]");
      if (links.length === 0) {
        showToast('⚠️ কোনো লিংক নেই', true);
        return;
      }
      const ok = await copyToClipboard(links.join('\n'));
      if (ok) {
        showToast(`✅ ${links.length}টি লিংক কপি হয়েছে!`);
      } else {
        showToast('❌ কপি করা যায়নি', true);
      }
    };

    // ---------- ডিলিট ----------
    window.deleteLink = function (index) {
      let links = JSON.parse(localStorage.getItem(storageKey) || "[]");
      if (index >= 0 && index < links.length) {
        links.splice(index, 1);
        localStorage.setItem(storageKey, JSON.stringify(links));
        renderSavedLinks();
        statusEl.innerText = '🗑️ লিংক ডিলিট হয়েছে';
      }
    };

    // ---------- আপলোড ----------
    window.upload = async function () {
      const file = fileInput.files[0];
      if (!file) {
        statusEl.innerText = '⚠️ আগে একটি ছবি সিলেক্ট করো';
        return;
      }
      if (!file.type.startsWith('image/')) {
        statusEl.innerText = '❌ শুধু ইমেজ ফাইল আপলোড করো';
        return;
      }

      uploadBtn.disabled = true;
      statusEl.innerText = '⏳ আপলোড হচ্ছে... একটু অপেক্ষা করো';

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", uploadPreset);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        if (data.secure_url) {
          const links = JSON.parse(localStorage.getItem(storageKey) || "[]");
          links.push(data.secure_url);
          localStorage.setItem(storageKey, JSON.stringify(links));

          statusEl.innerText = '✅ আপলোড সফল! লিংক সেভ হয়েছে';
          renderSavedLinks();
          showToast('✅ লিংক সেভ হয়েছে!');
        } else {
          statusEl.innerText = '❌ আপলোড ব্যর্থ: ' + (data.error?.message || JSON.stringify(data));
        }
      } catch (err) {
        statusEl.innerText = '❌ নেটওয়ার্ক এরর: ' + err.message;
      } finally {
        uploadBtn.disabled = false;
      }
    };

    // ---------- ইনিশিয়াল ----------
    renderSavedLinks();
  })();
</script>
</body>
</html>
